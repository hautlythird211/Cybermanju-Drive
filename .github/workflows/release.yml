name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Rust: Lint & Test (gate) ─────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libssl-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy -- -W clippy::all -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

  # ─── WASM: Build for Web ─────────────────────────────────────────
  wasm-build:
    name: Build WASM (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: npm run wasm:build

      - name: Upload WASM web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist-wasm/
          retention-days: 30

      - name: Upload WASM node module
        uses: actions/upload-artifact@v4
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm/
          retention-days: 30

  # ─── Windows: Build Desktop ──────────────────────────────────────
  windows-build:
    name: Build Windows
    runs-on: windows-latest
    needs: [rust-check, wasm-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download pre-built WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*/*.msi
            src-tauri/target/release/bundle/*/*.exe
          retention-days: 30

  # ─── Linux: Build Desktop (deb + AppImage + rpm) ──────────────────
  linux-build:
    name: Build Linux (deb+AppImage+rpm)
    runs-on: ubuntu-latest
    needs: [rust-check, wasm-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libssl-dev \
            libfuse2 \
            rpm \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download pre-built WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/*/*.deb
            src-tauri/target/release/bundle/*/*.AppImage
          retention-days: 30

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30

  # ─── Linux: Build RPM ────────────────────────────────────────────
  rpm-build:
    name: Build Linux (RPM)
    runs-on: ubuntu-latest
    needs: [rust-check, linux-build]
    if: always()
    steps:
      - name: Download RPM from linux-build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-linux-rpm
          path: rpm-out

      - name: Upload RPM artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: rpm-out/*.rpm
          retention-days: 30

  # ─── Linux: Build Flatpak ────────────────────────────────────────
  flatpak-build:
    name: Build Linux (Flatpak)
    runs-on: ubuntu-latest
    needs: [rust-check, linux-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Debian package
        run: |
          for i in $(seq 1 6); do
            if gh run download ${{ github.run_id }} --name release-linux-deb --dir artifacts 2>/dev/null; then
              echo "Downloaded successfully"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Ensure artifacts directory exists
        run: mkdir -p artifacts

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and SDK
        run: |
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir src-tauri/flatpak/com.cybermanju.drive.yml
          flatpak build-bundle repo cybermanju-drive.flatpak com.cybermanju.drive

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: cybermanju-drive.flatpak
          retention-days: 30

  # ─── Linux: Build Arch Package ────────────────────────────────────
  arch-build:
    name: Build Linux (Arch/CachyOS)
    runs-on: ubuntu-latest
    needs: [rust-check, wasm-build, linux-build]
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            libsoup3 \
            pkg-config \
            openssl \
            curl \
            sudo

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE

      - name: Install Rust
        run: |
          sudo -u builder bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
          sudo -u builder bash -c 'source $HOME/.cargo/env && rustup default stable'

      - name: Install Node.js
        run: pacman -S --noconfirm nodejs npm

      - name: Install npm dependencies
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            cd $GITHUB_WORKSPACE
            npm ci
          "

      - name: Download pre-built WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm

      - name: Fix WASM ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE/node_modules/cybermanju-drive-wasm

      - name: Build Arch package
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            cd $GITHUB_WORKSPACE
            npm run tauri build
          "

      - name: Collect artifacts
        run: |
          chown -R builder:builder $GITHUB_WORKSPACE
          sudo -u builder bash -c '
            mkdir -p dist-arch
            cp src-tauri/target/release/bundle/deb/*.deb dist-arch/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage dist-arch/ 2>/dev/null || true
          '

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: dist-arch/
          retention-days: 30

  # ─── macOS: Build Desktop (dmg + app) ────────────────────────────
  macos-build:
    name: Build macOS
    runs-on: macos-latest
    needs: [rust-check, wasm-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download pre-built WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/*/*.dmg
            src-tauri/target/release/bundle/*/*.app
          retention-days: 30

  # ─── Android: Build APK ──────────────────────────────────────────
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [rust-check, wasm-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          sdkmanager --licenses <<< "y"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download pre-built WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Initialize Android project
        run: npx tauri android init

      - name: Limit Android ABIs to arm64-v8a and x86_64 only
        run: |
          python3 << 'EOF'
          import re
          with open('src-tauri/gen/android/app/build.gradle.kts') as f:
              content = f.read()
          content = re.sub(r'"armeabi-v7a"[\s,]*', '', content)
          content = re.sub(r'"x86"[\s,]*', '', content)
          content = re.sub(r',\s*,', ',', content)
          content = re.sub(r'\[\s*,', '[', content)
          content = re.sub(r',\s*\]', ']', content)
          with open('src-tauri/gen/android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Updated ABIs')
          EOF
      - name: Remove armv7 Rust target
        run: rustup target remove armv7-linux-androideabi || true

      - name: Build Android APK
        run: npx tauri android build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  # ─── Docker: Build Image ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cybermanju-drive:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        run: docker images cybermanju-drive:latest

  # ─── Create GitHub Release ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - rust-check
      - wasm-build
      - windows-build
      - linux-build
      - rpm-build
      - flatpak-build
      - arch-build
      - macos-build
      - android-build
      - docker-build
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: false

      - name: Download WASM artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: dist-wasm
          merge-multiple: false

      - name: List downloaded artifacts
        run: find artifacts/ -type f 2>/dev/null | head -100 || echo "No artifacts found"

      - name: Generate release notes
        id: notes
        run: |
          cp RELEASE_NOTES.md release_notes.md

      - name: Package artifacts
        run: |
          mkdir -p packages
          
          # Package Windows artifacts
          if [ -d "artifacts/release-windows" ]; then
            cd artifacts/release-windows
            zip -r ../../packages/dist-windows.zip . || true
            cd ../..
          fi
          
          # Package Linux artifacts
          if [ -d "artifacts/release-linux" ]; then
            cd artifacts/release-linux
            zip -r ../../packages/dist-linux.zip . || true
            cd ../..
          fi
          
          # Package RPM artifacts
          if [ -d "artifacts/release-rpm" ]; then
            cd artifacts/release-rpm
            zip -r ../../packages/dist-rpm.zip . || true
            cd ../..
          fi
          
          # Package Flatpak artifacts
          if [ -d "artifacts/release-flatpak" ]; then
            cd artifacts/release-flatpak
            zip -r ../../packages/dist-flatpak.zip . || true
            cd ../..
          fi
          
          # Package Arch artifacts
          if [ -d "artifacts/release-arch" ]; then
            cd artifacts/release-arch
            zip -r ../../packages/dist-arch.zip . || true
            cd ../..
          fi
          
          # Package macOS artifacts
          if [ -d "artifacts/release-macos" ]; then
            cd artifacts/release-macos
            zip -r ../../packages/dist-macos.zip . || true
            cd ../..
          fi
          
          # Package Android artifacts
          if [ -d "artifacts/release-android" ]; then
            cd artifacts/release-android
            zip -r ../../packages/dist-android.zip . || true
            cd ../..
          fi
          
          # Package WASM artifacts
          if [ -d "artifacts/dist-wasm" ]; then
            cd artifacts/dist-wasm
            zip -r ../../packages/dist-wasm.zip . || true
            cd ../..
          fi
          
          # List all packages
          ls -la packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cybermanju Drive ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
