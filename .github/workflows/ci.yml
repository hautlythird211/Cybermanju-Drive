# ──────────────────────────────────────────────────────────────────────────────
# Cybermanju Drive — Consolidated CI & Release workflow
# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push (main)      → lint, test, build all platforms, deploy Pages, publish release
#   pull_request     → lint, test, build all platforms (no deploy/release)
#   tag "v*"         → lint, test, build all platforms, publish release
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_GHA_CACHE_TAG: rust-sccache
  # Shared apt packages across Linux jobs
  SYS_DEPS: >-
    libwebkit2gtk-4.1-dev
    libgtk-3-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libsoup-3.0-dev
    libjavascriptcoregtk-4.1-dev
    pkg-config
    build-essential
    libssl-dev
    libudev-dev

jobs:
  # ─── Rust: Lint & Test (gate) ─────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYS_DEPS }}

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-rust
          cache-on-failure: true

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy -- -W clippy::all -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

  # ─── Docker: Build Image (gate only) ──────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cybermanju-drive:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        if: success() || failure()
        run: docker images cybermanju-drive:latest

  # ─── WASM: Build for Web (shared dependency for all platforms) ────
  wasm-build:
    name: Build WASM (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        env:
          # Primary: standard VITE_ + OAUTH prefix
          VITE_OAUTH_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || secrets.VITE_OAUTH_GOOGLE_CLIENT_ID || secrets.VITE_OAUTH_GOOGLE_DRIVE_CLIENT_ID || '' }}
          VITE_OAUTH_GOOGLE_PHOTOS_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || secrets.VITE_OAUTH_GOOGLE_CLIENT_ID || secrets.VITE_OAUTH_GOOGLE_PHOTOS_CLIENT_ID || '' }}
          VITE_OAUTH_GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID || secrets.GITHUB_CLIENT_ID || secrets.VITE_GITHUB_CLIENT_ID || secrets.VITE_OAUTH_GITHUB_CLIENT_ID || '' }}
          VITE_OAUTH_GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || secrets.VITE_GITLAB_CLIENT_ID || secrets.VITE_OAUTH_GITLAB_CLIENT_ID || '' }}
          VITE_OAUTH_TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID || secrets.VITE_TELEGRAM_CLIENT_ID || secrets.VITE_OAUTH_TELEGRAM_CLIENT_ID || '' }}
          # Fallback: bare names (no VITE_ prefix) for env[provider] pattern
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          GOOGLE_PHOTOS_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID || secrets.GITHUB_CLIENT_ID || '' }}
          GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || '' }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID || '' }}
          # Fallback: single Google ID for both services
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || secrets.VITE_OAUTH_GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID || '' }}
        run: |
          echo "=== OAuth secret injection check ==="
          echo "Google Drive:  ${VITE_OAUTH_GOOGLE_DRIVE_CLIENT_ID:+SET(${#VITE_OAUTH_GOOGLE_DRIVE_CLIENT_ID} chars)}${VITE_OAUTH_GOOGLE_DRIVE_CLIENT_ID:-NOT SET}"
          echo "Google Photos: ${VITE_OAUTH_GOOGLE_PHOTOS_CLIENT_ID:+SET(${#VITE_OAUTH_GOOGLE_PHOTOS_CLIENT_ID} chars)}${VITE_OAUTH_GOOGLE_PHOTOS_CLIENT_ID:-NOT SET}"
          echo "GitHub:        ${VITE_OAUTH_GITHUB_CLIENT_ID:+SET(${#VITE_OAUTH_GITHUB_CLIENT_ID} chars)}${VITE_OAUTH_GITHUB_CLIENT_ID:-NOT SET}"
          echo "GitLab:        ${VITE_OAUTH_GITLAB_CLIENT_ID:+SET(${#VITE_OAUTH_GITLAB_CLIENT_ID} chars)}${VITE_OAUTH_GITLAB_CLIENT_ID:-NOT SET}"
          echo "Telegram:      ${VITE_OAUTH_TELEGRAM_CLIENT_ID:+SET(${#VITE_OAUTH_TELEGRAM_CLIENT_ID} chars)}${VITE_OAUTH_TELEGRAM_CLIENT_ID:-NOT SET}"
          echo "=== Building WASM ==="
          for attempt in 1 2 3; do
            echo "=== WASM build attempt $attempt/3 ==="
            CARGO_NET_GIT_FETCH_WITH_CLI=true npm run wasm:build && break
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      - name: Upload WASM web artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-wasm
          path: dist-wasm/
          retention-days: 30

      - name: Upload WASM node module (for Tauri builds)
        uses: actions/upload-artifact@v5
        with:
          name: wasm-node-module
          path: node_modules/cybermanju-drive-wasm/
          retention-days: 30

  # ─── Windows: Build Desktop ──────────────────────────────────────
  windows-build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build WASM module
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          cd crates/drive-wasm && wasm-pack build --target bundler --out-dir ../../node_modules/cybermanju-drive-wasm

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 30

  # ─── Linux: Build Desktop (deb + AppImage + rpm + binary) ──────────
  linux-build:
    name: Build Linux (deb+AppImage+rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYS_DEPS }} libfuse2 rpm xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build WASM module
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          cd crates/drive-wasm && wasm-pack build --target bundler --out-dir ../../node_modules/cybermanju-drive-wasm

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-rust
          cache-on-failure: true

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload Debian package
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Upload RPM package
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-rpm
          path: target/release/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-binary
          path: target/release/cybermanju-drive
          retention-days: 30

  # ─── Linux: Build Flatpak ────────────────────────────────────────
  flatpak-build:
    name: Build Linux (Flatpak)
    runs-on: ubuntu-latest
    needs: [linux-build]
    steps:
      - uses: actions/checkout@v5

      - name: Download binary
        uses: actions/download-artifact@v6
        with:
          name: release-linux-binary
          path: artifacts

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and SDK
        run: |
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir src-tauri/flatpak/com.cybermanju.drive.yml
          flatpak build-bundle repo cybermanju-drive.flatpak com.cybermanju.drive

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-flatpak
          path: cybermanju-drive.flatpak
          retention-days: 30

  # ─── Linux: Build Arch Package ────────────────────────────────────
  arch-build:
    name: Build Linux (Arch/CachyOS)
    runs-on: ubuntu-latest
    needs: [linux-build]
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            libsoup3 \
            pkg-config \
            openssl \
            curl \
            sudo \
            xdg-utils

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v5

      - name: Fix ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE

      - name: Install Rust
        run: |
          sudo -u builder bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
          sudo -u builder bash -c 'source $HOME/.cargo/env && rustup default stable'

      - name: Install Node.js
        run: pacman -S --noconfirm nodejs npm

      - name: Install npm dependencies
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            cd $GITHUB_WORKSPACE
            npm ci
          "

      - name: Build WASM module
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            cd $GITHUB_WORKSPACE/crates/drive-wasm
            wasm-pack build --target bundler --out-dir ../../node_modules/cybermanju-drive-wasm
          "
          chown -R builder:builder $GITHUB_WORKSPACE/node_modules/cybermanju-drive-wasm

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-rust
          cache-on-failure: true

      - name: Fix cache ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE/target 2>/dev/null || true

      - name: Build Arch package
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            cd $GITHUB_WORKSPACE
            npm run tauri build -- --bundles deb,rpm
          "

      - name: Collect artifacts
        run: |
          chown -R builder:builder $GITHUB_WORKSPACE
          sudo -u builder bash -c '
            mkdir -p dist-arch
            cp target/release/bundle/deb/*.deb dist-arch/ 2>/dev/null || true
            cp target/release/bundle/appimage/*.AppImage dist-arch/ 2>/dev/null || true
          '

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-arch
          path: dist-arch/
          retention-days: 30

  # ─── macOS: Build Desktop (dmg + app) ────────────────────────────
  macos-build:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build WASM module
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          brew install llvm
          export CC_wasm32_unknown_unknown="$(brew --prefix llvm)/bin/clang"
          export AR_wasm32_unknown_unknown="$(brew --prefix llvm)/bin/llvm-ar"
          cd crates/drive-wasm && wasm-pack build --target bundler --out-dir ../../node_modules/cybermanju-drive-wasm

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          retention-days: 30

  # ─── Android: Build APK (arm64 only — ort-sys lacks armv7 prebuilt) ──
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          sdkmanager --licenses <<< "y"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build WASM module
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          cd crates/drive-wasm && wasm-pack build --target bundler --out-dir ../../node_modules/cybermanju-drive-wasm

      - name: Install Rust target (arm64 only)
        run: rustup target add aarch64-linux-android

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Initialize Android project
        run: npx tauri android init

      - name: Add JitPack repo for serialplugin (usb-serial-for-android)
        run: |
          python3 << 'EOF'
          import os
          jitpack = "maven { url = uri(\"https://www.jitpack.io\") }"
          for root, dirs, files in os.walk("src-tauri/gen/android"):
              for f in files:
                  if f in ("settings.gradle.kts", "settings.gradle"):
                      path = os.path.join(root, f)
                      with open(path) as fh:
                          content = fh.read()
                      if "jitpack" not in content.lower():
                          content = content.replace(
                              "mavenCentral()",
                              "mavenCentral()\n            " + jitpack
                          )
                          with open(path, "w") as fh:
                              fh.write(content)
                          print(f"Added JitPack to {path}")
                  elif f in ("build.gradle.kts", "build.gradle"):
                      path = os.path.join(root, f)
                      with open(path) as fh:
                          content = fh.read()
                      if "jitpack" not in content.lower() and "allprojects" in content:
                          content = content.replace(
                              "mavenCentral()",
                              "mavenCentral()\n            " + jitpack
                          )
                          with open(path, "w") as fh:
                              fh.write(content)
                          print(f"Added JitPack to {path}")
          EOF

      - name: Pin to arm64-v8a ABI only (ort-sys has no armv7 prebuilt)
        run: |
          python3 << 'EOF'
          import re
          with open('src-tauri/gen/android/app/build.gradle.kts') as f:
              content = f.read()
          content = re.sub(r'"x86_64"[\s,]*', '', content)
          content = re.sub(r'"armeabi-v7a"[\s,]*', '', content)
          content = re.sub(r'"x86"[\s,]*', '', content)
          content = re.sub(r',\s*,', ',', content)
          content = re.sub(r'\[\s*,', '[', content)
          content = re.sub(r',\s*\]', ']', content)
          with open('src-tauri/gen/android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Pinned to arm64-v8a only')
          EOF

      - name: Build Android APK (arm64 only)
        run: npx tauri android build --target aarch64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  # ─── Deploy: GitHub Pages (push to main only) ──────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: wasm-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Download WASM artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-wasm
          path: dist-wasm/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-wasm/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ─── Publish GitHub Release (push to main or tag) ──────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - wasm-build
      - windows-build
      - linux-build
      - flatpak-build
      - arch-build
      - macos-build
      - android-build
      - docker-build
    if: |
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        startsWith(github.ref, 'refs/tags/v')
      )
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-detect version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing release/tag (if any)
        continue-on-error: true
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists — deleting old release and tag."
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            git push --delete origin "$TAG" 2>/dev/null || true
          else
            echo "Tag $TAG does not exist yet — proceeding fresh."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --oneline --no-decorate 2>/dev/null | head -100 || true)
          else
            COMMITS=$(git log --oneline --no-decorate -50 2>/dev/null || true)
          fi

          VERSION="${{ steps.version.outputs.version }}"

          cat > release_body.md << EOF
          # Cybermanju Drive

          **Quantum-resistant encrypted file manager** — desktop, mobile, web, Docker, and headless server.

          ## ⬇️ Quick Downloads

          ### 🖥️ Desktop

          | Platform | File | Description |
          |----------|------|-------------|
          | **Windows** | [cybermanju-drive_${VERSION}_x64-setup.exe](./cybermanju-drive_${VERSION}_x64-setup.exe) | NSIS installer (recommended) |
          | **Windows** | [cybermanju-drive_${VERSION}_x64.msi](./cybermanju-drive_${VERSION}_x64.msi) | MSI installer (enterprise/GPO) |
          | **macOS** | [cybermanju-drive_${VERSION}_aarch64.dmg](./cybermanju-drive_${VERSION}_aarch64.dmg) | DMG for Apple Silicon (M1/M2/M3/M4) |
          | **Linux (Debian/Ubuntu)** | [cybermanju-drive_${VERSION}_amd64.deb](./cybermanju-drive_${VERSION}_amd64.deb) | Debian/Ubuntu package |
          | **Linux (Fedora/RHEL)** | [cybermanju-drive-${VERSION}-1.x86_64.rpm](./cybermanju-drive-${VERSION}-1.x86_64.rpm) | RPM package |
          | **Linux (Universal)** | [cybermanju-drive_${VERSION}_amd64.AppImage](./cybermanju-drive_${VERSION}_amd64.AppImage) | Run anywhere — no install needed |
          | **Linux (Flatpak)** | [cybermanju-drive.flatpak](./cybermanju-drive.flatpak) | Sandboxed — Flathub-compatible |

          ### 📱 Mobile

          | Platform | File | Description |
          |----------|------|-------------|
          | **Android** | [cybermanju-drive.apk](./cybermanju-drive.apk) | APK for Android 10+ (arm64) |

          ### 🌐 Web & Containers

          | Platform | File | Description |
          |----------|------|-------------|
          | **Web (WASM)** | [dist-wasm.zip](./dist-wasm.zip) | Static site — deploy anywhere |
          | **Docker** | \`docker pull cybermanju-drive:latest\` | Pre-built container image |

          EOF

          # Append features from RELEASE_NOTES.md
          if [ -f RELEASE_NOTES.md ]; then
            awk '/^## Features/,/^## (Current Limitations|Roadmap)/' RELEASE_NOTES.md | \
              head -n -2 >> release_body.md 2>/dev/null || true
          fi

          cat >> release_body.md << 'EOF'

          ## Change Log

          EOF

          if [ -n "$COMMITS" ]; then
            echo '```' >> release_body.md
            echo "$COMMITS" >> release_body.md
            echo '```' >> release_body.md
          else
            echo "_No new commits since last release._" >> release_body.md
          fi

          # Append limitations and roadmap
          if [ -f RELEASE_NOTES.md ]; then
            awk '/^## (Current Limitations|Roadmap)/,0' RELEASE_NOTES.md >> release_body.md 2>/dev/null || true
          fi

      - name: Download all release artifacts
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: false

      - name: Download WASM artifacts
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
          pattern: dist-wasm
          merge-multiple: false

      - name: Package artifacts
        run: |
          mkdir -p packages

          # Windows: .exe and .msi
          find artifacts/release-windows -maxdepth 1 -name '*.exe' -exec cp {} packages/ \; 2>/dev/null || true
          find artifacts/release-windows -maxdepth 1 -name '*.msi' -exec cp {} packages/ \; 2>/dev/null || true

          # Linux: .deb, .rpm, .AppImage
          find artifacts/release-linux -maxdepth 1 -name '*.deb' -exec cp {} packages/ \; 2>/dev/null || true
          find artifacts/release-linux -maxdepth 1 -name '*.rpm' -exec cp {} packages/ \; 2>/dev/null || true
          find artifacts/release-linux -maxdepth 1 -name '*.AppImage' -exec cp {} packages/ \; 2>/dev/null || true

          # Flatpak
          find artifacts/release-flatpak -maxdepth 1 -name '*.flatpak' -exec cp {} packages/ \; 2>/dev/null || true

          # macOS: .dmg and .app
          find artifacts/release-macos -maxdepth 1 -name '*.dmg' -exec cp {} packages/ \; 2>/dev/null || true
          find artifacts/release-macos -maxdepth 1 -name '*.app' -exec cp {} packages/ \; 2>/dev/null || true

          # Android: .apk
          find artifacts/release-android -maxdepth 3 -name '*.apk' -exec cp {} packages/ \; 2>/dev/null || true

          # WASM web files (zip the folder since it contains many small files)
          [ -d "artifacts/dist-wasm" ] && \
            (cd "artifacts/dist-wasm" && zip -r "../../packages/dist-wasm.zip" .) || true

          ls -la packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Cybermanju Drive ${{ steps.version.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: packages/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
