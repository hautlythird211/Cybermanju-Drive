[package]
name = "cybermanju-drive-wasm"
version = "0.2.0"
edition = "2021"
description = "Cybermanju Drive — WASM bridge for browser-based crypto, compression, sync, and storage"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Crypto (pure Rust only, no C bindings)
blake3 = "1"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
ml-dsa = { version = "0.1.1", features = ["getrandom"] }
pqcrypto-mlkem = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
signature = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom_v0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_v0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

# Compression (pure Rust only)
lz4_flex = "0.11"
brotli = "7"
zstd = { version = "0.13", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers & timestamps
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Logging
wasm-logger = "0.2"
log = "0.4"
