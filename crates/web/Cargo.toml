[package]
name = "cybermanju-web"
version = "0.2.0"
edition = "2021"
description = "Web browser engine, DuckDuckGo search, and HTML renderer for Cybermanju OS"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
scraper = "0.21"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

# Native: rustls-tls for HTTPS, cybermanju-search for Tantivy
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
cybermanju-search = { path = "../search" }

# WASM: browser fetch API for HTTP
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "console", "Location", "Headers", "Request", "RequestInit", "Response", "Url", "HtmlIFrameElement", "Navigator"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
