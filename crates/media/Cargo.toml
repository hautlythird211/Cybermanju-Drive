[package]
name = "cybermanju-media"
version = "0.0.1"
description = "Cybermanju Drive — Media engine: VLC video playback, image processing, thumbnail extraction"
authors = ["Cybermanju Team"]
edition = "2021"

[dependencies]
# Image processing
image = { version = "0.25", features = ["webp", "jpeg", "png", "gif", "bmp", "tiff", "ico"] }
kamadak-exif = "0.5"
fast_image_resize = "5"

# Video metadata (ffprobe-style via infer + manual parsing)
infer = "0.16"
mime_guess = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Hashing
blake3 = "1"

# Async
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

# Logging
log = "0.4"

# Temp files
tempfile = "3"

# Optional ffmpeg frame extraction
ffmpeg-next = { version = "7", optional = true }

[features]
default = []
vlc = [] # Enable VLC/libvlc bindings (desktop only)
ffmpeg = ["dep:ffmpeg-next"]
