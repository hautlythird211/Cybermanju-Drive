[package]
name = "cybermanju-resolutions"
version = "0.1.0"
edition = "2021"
description = "Resolution tree, shard format, and root index for Cybermanju Drive"

[dependencies]
cybermanju-types = { path = "../types" }
cybermanju-erasure = { path = "../erasure" }
cybermanju-preview-keys = { path = "../preview-keys" }
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
memmap2 = "0.9"
