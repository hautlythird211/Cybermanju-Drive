[package]
name = "cybermanju-recovery"
version = "0.1.0"
edition = "2021"
description = "Recovery and reconstruction pipeline for Cybermanju Drive"

[dependencies]
cybermanju-types = { path = "../types" }
cybermanju-erasure = { path = "../erasure" }
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
