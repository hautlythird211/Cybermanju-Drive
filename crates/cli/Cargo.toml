[package]
name = "cybermanju-cli"
version = "0.1.0"
edition = "2021"
description = "Cybermanju Drive — Command-Line Interface & TUI"

[[bin]]
name = "cybermanju"
path = "src/main.rs"

[dependencies]
# Workspace crates
cybermanju-types = { path = "../types" }
cybermanju-crypto = { path = "../crypto" }
cybermanju-compression = { path = "../compression" }
cybermanju-db = { path = "../db" }
cybermanju-portable-db = { path = "../portable-db" }

# CLI + TUI
clap = { version = "4", features = ["derive"] }
anstyle = "1"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"

# HTTP
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
urlencoding = "2"
megalib = "0.11"

# General
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
blake3 = "1"
log = "0.4"
dirs = "6"
