[package]
name = "cybermanju-preview-keys"
version = "0.1.0"
edition = "2021"
description = "Preview key management and view tokens for Cybermanju Drive"

[dependencies]
hkdf = "0.13"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake3 = "1.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
