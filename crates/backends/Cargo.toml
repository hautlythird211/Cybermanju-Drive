[package]
name = "cybermanju-backends"
version = "0.1.0"
edition = "2021"
description = "Shared storage backend implementations for Cybermanju Drive"

[dependencies]
cybermanju-types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
urlencoding = "2"
megalib = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }
sha2 = "0.10"
rayon = "1.10"
which = "7"
blake3 = "1.5"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls = "0.23"
futures-util = "0.3"
secp256k1 = { version = "0.29", features = ["recovery", "rand-std"] }
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"
chacha20poly1305 = "0.10"
librqbit = { version = "9.0.0-rc.0", default-features = false, features = ["rust-tls"] }
