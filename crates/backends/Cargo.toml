[package]
name = "cybermanju-backends"
version = "0.1.0"
edition = "2021"
description = "Shared storage backend implementations for Cybermanju Drive"

[dependencies]
cybermanju-types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
urlencoding = "2"
megalib = "0.11"
tokio = { version = "1", features = ["rt", "macros"] }
sha2 = "0.10"
