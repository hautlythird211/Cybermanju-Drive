app-id: com.cybermanju.drive
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: cybermanju-drive

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --env=FLATPAK=1

modules:
  - name: cybermanju-drive
    buildsystem: simple
    build-commands:
      - install -Dm755 cybermanju-drive /app/bin/cybermanju-drive
    sources:
      - type: file
        path: ../../artifacts/cybermanju-drive
